services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foghorn
      POSTGRES_PASSWORD: foghorn
      POSTGRES_DB: foghorn
    volumes:
      - foghorn_pgdata:/var/lib/postgresql/data
    networks:
      - foghorn_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foghorn -d foghorn"]
      interval: 5s
      timeout: 5s
      retries: 12

  probe:
    build:
      context: .
      dockerfile: Dockerfile
      target: probe
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOGHORN__DATABASE_URL: "postgres://foghorn:foghorn@db:5432/foghorn"
      RUST_LOG: "foghorn_probe=info,reqwest=warn"
      # Signs TAP receipts. Read from the host environment (see .env, gitignored, 0600) rather than
      # config.toml so the key is never in a file that gets rsynced, committed or pasted into a
      # terminal. It authorises spending from the payer's escrow, so leaking it means losing the
      # escrow — not the queries.
      FOGHORN__TAP__SIGNER_KEY: "${FOGHORN_TAP_SIGNER_KEY:-}"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./test-sets:/app/test-sets:ro
    working_dir: /app
    networks:
      - foghorn_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      FOGHORN__DATABASE_URL: "postgres://foghorn:foghorn@db:5432/foghorn"
      FOGHORN__API_PORT: "8080"
      FOGHORN__API_HOST: "0.0.0.0"
      RUST_LOG: "foghorn_api=info,tower_http=info"
    volumes:
      # The API needs the same config the probe reads, not just a database URL. Without this it
      # silently falls back to defaults — it advertised a 300s probe cadence while the box was
      # configured for 3600, so freshness thresholds derived from it were wrong in the unsafe
      # direction. Read-only: the API never writes config.
      - ./config.toml:/app/config.toml:ro
    working_dir: /app
    networks:
      - foghorn_net

volumes:
  foghorn_pgdata:

networks:
  foghorn_net:
    driver: bridge
